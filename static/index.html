<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Reminders</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app-container">
    <!-- Header / Top Section -->
    <header class="app-header">
      <h1 class="app-title">Voice Reminders</h1>
      <p class="app-subtitle">Speak naturally to create and schedule your reminders</p>
      
      <div class="record-wrapper">
        <button id="record-btn" class="record-button" type="button">
          <span class="mic-icon-wrapper">
            <svg class="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
              <line x1="12" y1="19" x2="12" y2="22"></line>
            </svg>
            <span class="stop-icon"></span>
          </span>
          <span id="record-label">Record Reminder</span>
        </button>
      </div>
    </header>

    <!-- Middle: Live Transcript Box -->
    <section class="transcript-section">
      <div class="section-label-row">
        <label for="transcript-box" class="section-label">Transcript</label>
        <button id="clear-transcript-btn" class="text-link-btn" type="button">Clear</button>
      </div>
      <div id="transcript-box" class="transcript-box" contenteditable="true" data-placeholder="Click 'Record Reminder' and speak, or type here directly..."></div>
    </section>

    <!-- Bottom: Editable Reminder Card -->
    <section class="reminder-card-section">
      <h2 class="card-section-title">Reminder Details</h2>
      <form id="reminder-form" class="reminder-form">
        <div class="form-group full-width">
          <label for="reminder-title">Title</label>
          <input type="text" id="reminder-title" name="title" placeholder="e.g., Sarah's Birthday" required>
        </div>

        <div class="form-grid">
          <div class="form-group">
            <label for="reminder-category">Category</label>
            <select id="reminder-category" name="category">
              <option value="To-Do">To-Do</option>
              <option value="Birthday">Birthday</option>
              <option value="Anniversary">Anniversary</option>
              <option value="Meeting">Meeting</option>
              <option value="Custom">Custom</option>
            </select>
          </div>

          <div class="form-group">
            <label for="reminder-date">Date</label>
            <input type="date" id="reminder-date" name="date" required>
          </div>

          <div class="form-group">
            <label for="reminder-time">Time</label>
            <input type="time" id="reminder-time" name="time" required>
          </div>

          <div class="form-group">
            <label for="reminder-repeat">Repeat</label>
            <select id="reminder-repeat" name="repeat">
              <option value="None">None</option>
              <option value="Yearly">Yearly</option>
              <option value="Monthly">Monthly</option>
              <option value="Weekly">Weekly</option>
            </select>
          </div>

          <div class="form-group full-width">
            <label for="reminder-alert">Advance Alert</label>
            <select id="reminder-alert" name="advance_alert">
              <option value="Morning of event">Morning of event</option>
              <option value="1 hour before">1 hour before</option>
              <option value="1 day before">1 day before</option>
              <option value="2 days before">2 days before</option>
              <option value="1 week before">1 week before</option>
              <option value="None">None</option>
            </select>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" id="save-btn" class="primary-button">Save Reminder</button>
        </div>
      </form>
    </section>

    <!-- Bottom: Saved Reminders List -->
    <section class="saved-reminders-section">
      <div class="section-label-row">
        <h2 class="card-section-title">Saved Reminders</h2>
        <span id="reminders-count" class="reminders-count">0 reminders</span>
      </div>

      <div id="reminders-list" class="reminders-list">
        <!-- Rendered dynamically -->
      </div>
    </section>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
